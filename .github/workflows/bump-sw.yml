name: Bump SW Cache Version
on:
  push:
    branches: [main]
    paths-ignore:
      - 'sw.js'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump version
        run: |
          TS=$(date +%Y%m%d%H%M%S)
          sed -i "s/const CACHE_VERSION = '[^']*'/const CACHE_VERSION = '$TS'/" sw.js
          git config user.email "bot@github.com"
          git config user.name "SW-Bump-Bot"
          git add sw.js
          git diff --cached --quiet || git commit -m "chore: bump SW $TS" && git push
